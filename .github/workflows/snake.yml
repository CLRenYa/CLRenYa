name: Generate snake 🐍 contribution grid

on:
  schedule:
    - cron: "0 0 * * *" # 每天自动生成一次
  workflow_dispatch: # 允许手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 亮色模式蛇蛇(东京夜色配色 + 粉色蛇身)
      - name: Generate snake svg (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23ff69b4&color_dots=%231a1b26,%233b4261,%23565f89,%237aa2f7,%23ff69b4

      # 暗色模式蛇蛇
      - name: Generate snake svg (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23ff69b4

      # 推送到 assets 分支(与猫娘图共用素材分支)
      - name: Deploy to assets branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: assets
          keep_files: true
