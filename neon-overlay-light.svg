<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <defs>
    <linearGradient id="neonL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d63384">
        <animate attributeName="stop-color" values="#d63384;#4263eb;#d63384" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#7048e8">
        <animate attributeName="stop-color" values="#7048e8;#d63384;#7048e8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#4263eb">
        <animate attributeName="stop-color" values="#4263eb;#7048e8;#4263eb" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b">
        <animate attributeName="stdDeviation" values="2;5;2" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <linearGradient id="tailBL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-38">
      <stop offset="0" stop-color="#4263eb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4263eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailPL" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-36">
      <stop offset="0" stop-color="#d63384" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d63384" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 白底圆角画布:亮色主题下自成一块霓虹招牌 -->
  <rect x="10" y="10" width="700" height="200" rx="18" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- 霓虹招牌外框 -->
  <rect x="120" y="60" width="480" height="100" rx="14" fill="none" stroke="url(#neonL)" stroke-width="2.5" filter="url(#glowL)">
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- 主标题 -->
  <text x="360" y="125" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="52" font-weight="bold" fill="url(#neonL)" filter="url(#glowL)">
    CLRenYa
    <animate attributeName="opacity" values="1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- 副标题 -->
  <text x="360" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#868e96" letter-spacing="4">
    CODE · ANIME · AESTHETIC
  </text>

  <!-- 游走光点 -->
  <circle r="4" fill="#d63384" filter="url(#softL)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M120,60 h480 v100 h-480 z"/>
    <animate attributeName="fill" values="#d63384;#4263eb;#7048e8;#d63384" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ☄️ 流星 · 蓝 -->
  <g filter="url(#softL)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.12;0.135;0.18;0.195;0.2;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="80,20;80,20;430,200;430,200;430,200;430,200;430,200" keyTimes="0;0.12;0.195;0.2;0.21;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-38" stroke="url(#tailBL)" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="2" fill="#4263eb"/>
  </g>

  <!-- ☄️ 流星 · 粉 -->
  <g filter="url(#softL)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.58;0.595;0.64;0.655;0.66;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640,20;640,20;300,205;300,205;300,205;300,205;300,205" keyTimes="0;0.58;0.655;0.66;0.67;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-36" stroke="url(#tailPL)" stroke-width="2.2" stroke-linecap="round"/>
    <circle r="1.8" fill="#d63384"/>
  </g>
</svg>
