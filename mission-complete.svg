<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b2e"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ece6a">
        <animate attributeName="stop-color" values="#9ece6a;#ff69b4;#9ece6a" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7aa2f7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="tailB2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-33">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#a9c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailP2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-31">
      <stop offset="0" stop-color="#ffe1ee" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b">
        <animate attributeName="stdDeviation" values="2;5;2" dur="2.8s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="mglow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="mb"/>
      <feMerge>
        <feMergeNode in="mb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 逐段揭示遮罩 -->
    <mask id="reveal2">
      <rect x="0" y="0" width="0" height="120" fill="#fff">
        <animate attributeName="width" values="0;720;720;0" keyTimes="0;0.28;0.92;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <style>
      .ch { font-family: Consolas, 'Courier New', monospace; font-size: 26px; font-weight: bold; fill: url(#neon2); filter: url(#glow2); }
      .deco { font-family: Consolas, 'Courier New', monospace; font-size: 20px; fill: #565f89; }
      .sub { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #565f89; opacity: 0; animation: fade 4s infinite; }
      @keyframes fade { 0%,30% { opacity: 0; } 45%,90% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="720" height="120" fill="url(#bg2)"/>

  <!-- 扫描线 -->
  <rect x="0" y="0" width="720" height="2" fill="#ff69b4" opacity="0.15">
    <animate attributeName="y" values="0;118;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ☄️ 流星 · 蓝白 -->
  <g filter="url(#mglow2)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.15;0.165;0.21;0.225;0.23;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="90,-10;90,-10;440,150;440,150;440,150;440,150;440,150" keyTimes="0;0.15;0.225;0.23;0.24;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-33" stroke="url(#tailB2)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-40" y2="-14" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- ☄️ 流星 · 粉 -->
  <g filter="url(#mglow2)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.6;0.615;0.66;0.675;0.68;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="630,-10;630,-10;300,155;300,155;300,155;300,155;300,155" keyTimes="0;0.6;0.675;0.68;0.69;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-31" stroke="url(#tailP2)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="-13" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
    <circle r="1.8" fill="#fff5fa"/>
  </g>

  <!-- 标题行:装饰条 + MISSION COMPLETE 整体居中,遮罩逐段点亮 -->
  <g mask="url(#reveal2)">
    <text class="deco" x="360" y="52" text-anchor="middle" xml:space="preserve">░▒▓█▓▒░  MISSION COMPLETE  ░▒▓█▓▒░</text>
  </g>

  <!-- 尾部光标(紧跟标题右缘) -->
  <rect x="586" y="34" width="13" height="22" fill="#ff69b4" filter="url(#glow2)">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- 副标题:与主标题同一中轴 -->
  <text class="sub" x="360" y="86" text-anchor="middle">✦ ･ﾟ✧ 感謝观看,记得点个 Star 再走呀 ✧ﾟ･ ✦</text>

  <!-- 两侧闪烁星 -->
  <g fill="#c0caf5">
    <circle cx="60" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="80" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="90" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="105" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="18" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="25" cy="20" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="695" cy="100" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ✦ 十字光芒亮星 -->
  <g stroke="#a9c6ff" stroke-width="1">
    <g transform="translate(120,25)" opacity="0.8">
      <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(600,95)" opacity="0.8">
      <line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
