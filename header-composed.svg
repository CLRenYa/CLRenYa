<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101226"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="neonD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff69b4">
        <animate attributeName="stop-color" values="#ff69b4;#7aa2f7;#ff69b4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#ff69b4;#bb9af7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7aa2f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="tailB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-54">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#a9c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailP" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-50">
      <stop offset="0" stop-color="#ffe1ee" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bgSky)"/>

  <!-- ✨ 闪烁星点 -->
  <g fill="#c0caf5">
    <circle cx="40" cy="30" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="140" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60" r="1.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="25" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="190" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="170" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="150" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="110" r="1.2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="200" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="100" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="195" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 粉紫彩色星 -->
  <g>
    <circle cx="100" cy="150" r="2" fill="#d0779b"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="180" r="1.8" fill="#b6688f"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="2" fill="#d0779b"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="120" r="1.8" fill="#8a91c4"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ✦ 十字光芒亮星 -->
  <g stroke="#a9c6ff" stroke-width="1">
    <g transform="translate(95,55)" opacity="0.8">
      <line x1="-9" y1="0" x2="9" y2="0"/><line x1="0" y1="-9" x2="0" y2="9"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(310,105)" opacity="0.8">
      <line x1="-11" y1="0" x2="11" y2="0"/><line x1="0" y1="-11" x2="0" y2="11"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(610,45)" opacity="0.8">
      <line x1="-10" y1="0" x2="10" y2="0"/><line x1="0" y1="-10" x2="0" y2="10"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(800,175)" opacity="0.8">
      <line x1="-12" y1="0" x2="12" y2="0"/><line x1="0" y1="-12" x2="0" y2="12"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 🌸 樱花瓣漂移(外层横移 + 内层摆动) -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" values="-20,40;920,40" dur="18s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3s" repeatCount="indefinite"/>
        <ellipse rx="3" ry="1.8" fill="#ff9ecb" opacity="0.5"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="-20,95;920,95" dur="22s" begin="-6s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="3.6s" repeatCount="indefinite"/>
        <ellipse rx="2.4" ry="1.4" fill="#ffb7d9" opacity="0.45"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="-20,160;920,160" dur="16s" begin="-3s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="2.6s" repeatCount="indefinite"/>
        <ellipse rx="3.4" ry="2" fill="#ff9ecb" opacity="0.5"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="-20,25;920,25" dur="24s" begin="-12s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,9;0,0" dur="4s" repeatCount="indefinite"/>
        <ellipse rx="2.2" ry="1.3" fill="#ffc4e0" opacity="0.4"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="-20,130;920,130" dur="20s" begin="-9s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="3.2s" repeatCount="indefinite"/>
        <ellipse rx="2.8" ry="1.6" fill="#ff9ecb" opacity="0.5"/></g></g>
  </g>

  <!-- 霓虹招牌外框 -->
  <rect x="210" y="60" width="480" height="100" rx="14" fill="none" stroke="url(#neonD)" stroke-width="2.5" filter="url(#glowD)">
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- 主标题 -->
  <text x="450" y="125" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="52" font-weight="bold" fill="url(#neonD)" filter="url(#glowD)">
    CLRenYa
    <animate attributeName="opacity" values="1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- 副标题 -->
  <text x="450" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#a9b8ff" letter-spacing="4" opacity="0.9">
    CODE · ANIME · AESTHETIC
  </text>

  <!-- 游走光点(沿招牌边框) -->
  <circle r="4" fill="#ff69b4" filter="url(#softD)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M210,60 h480 v100 h-480 z"/>
    <animate attributeName="fill" values="#ff69b4;#7aa2f7;#bb9af7;#ff69b4" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ☄️ 流星 · 蓝白 -->
  <g filter="url(#softD)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.10;0.115;0.16;0.175;0.18;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="80,-20;80,-20;480,220;480,220;480,220;480,220;480,220" keyTimes="0;0.10;0.175;0.18;0.19;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-54" stroke="url(#tailB)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-40" y2="-23" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- ☄️ 流星 · 粉 -->
  <g filter="url(#softD)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.55;0.565;0.61;0.625;0.63;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="820,-20;820,-20;420,230;420,230;420,230;420,230;420,230" keyTimes="0;0.55;0.625;0.63;0.64;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-50" stroke="url(#tailP)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="-21" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
    <circle r="1.8" fill="#fff5fa"/>
  </g>
</svg>
