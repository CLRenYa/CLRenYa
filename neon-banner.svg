<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101226"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff69b4">
        <animate attributeName="stop-color" values="#ff69b4;#7aa2f7;#ff69b4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#ff69b4;#bb9af7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7aa2f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="tailB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#a9c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailP" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-36">
      <stop offset="0" stop-color="#ffe1ee" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="180" fill="url(#bg)"/>

  <!-- 扫描线网格 -->
  <g stroke="#2a2d4a" stroke-width="1" opacity="0.5">
    <line x1="0" y1="45" x2="720" y2="45"/>
    <line x1="0" y1="135" x2="720" y2="135"/>
  </g>

  <!-- 霓虹招牌外框 -->
  <rect x="120" y="40" width="480" height="100" rx="14" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- 主标题 -->
  <text x="360" y="105" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="52" font-weight="bold" fill="url(#neon)" filter="url(#glow)">
    CLRenYa
    <animate attributeName="opacity" values="1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- 副标题 -->
  <text x="360" y="128" text-anchor="middle" font-family="monospace" font-size="13" fill="#565f89" letter-spacing="4">
    CODE · ANIME · AESTHETIC
  </text>

  <!-- 游走光点 -->
  <circle r="4" fill="#ff69b4" filter="url(#soft)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M120,40 h480 v100 h-480 z"/>
    <animate attributeName="fill" values="#ff69b4;#7aa2f7;#bb9af7;#ff69b4" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 闪烁星点 -->
  <g fill="#c0caf5">
    <circle cx="60" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="60" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="120" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="130" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="100" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="150" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="155" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="160" r="1.1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="15" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ✦ 十字光芒亮星 -->
  <g stroke="#a9c6ff" stroke-width="1">
    <g transform="translate(100,35)" opacity="0.8">
      <line x1="-7" y1="0" x2="7" y2="0"/><line x1="0" y1="-7" x2="0" y2="7"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(640,150)" opacity="0.8">
      <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(35,95)" opacity="0.8">
      <line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ☄️ 流星 · 蓝白 -->
  <g filter="url(#soft)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.12;0.135;0.18;0.195;0.2;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="80,-10;80,-10;430,170;430,170;430,170;430,170;430,170" keyTimes="0;0.12;0.195;0.2;0.21;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-38" stroke="url(#tailB)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-40" y2="-16" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- ☄️ 流星 · 粉 -->
  <g filter="url(#soft)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.58;0.595;0.64;0.655;0.66;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640,-10;640,-10;300,175;300,175;300,175;300,175;300,175" keyTimes="0;0.58;0.655;0.66;0.67;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-36" stroke="url(#tailP)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="-15" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
    <circle r="1.8" fill="#fff5fa"/>
  </g>
</svg>
