<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101226"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#ff69b4;#7aa2f7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#9ece6a;#bb9af7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b">
        <animate attributeName="stdDeviation" values="2;5;2" dur="2.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tailBlue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#a9c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailPink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-52">
      <stop offset="0" stop-color="#ffe1ee" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
    <filter id="mglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="mb"/>
      <feMerge>
        <feMergeNode in="mb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 逐段揭示遮罩:左→右扫开 -->
    <mask id="reveal">
      <rect x="0" y="0" width="0" height="130" fill="#fff">
        <animate attributeName="width" values="0;720;720;0" keyTimes="0;0.25;0.92;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <style>
      .bk { font-family: Consolas, 'Courier New', monospace; font-size: 24px; font-weight: bold; fill: url(#boot); filter: url(#glow3); }
      .deco { font-family: Consolas, 'Courier New', monospace; font-size: 20px; fill: #565f89; }
      .ln { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #9ece6a; opacity: 0; animation: lf 4.5s infinite; }
      @keyframes lf { 0%,35% { opacity: 0; } 45%,90% { opacity: 1; } 100% { opacity: 0; } }
      .ln2 { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #ff9e64; opacity: 0; animation: lf2 4.5s infinite; }
      @keyframes lf2 { 0%,55% { opacity: 0; } 65%,90% { opacity: 1; } 100% { opacity: 0; } }
      .bar { fill: #7aa2f7; filter: url(#glow3); }
    </style>
  </defs>

  <rect width="720" height="130" fill="url(#bg3)"/>

  <!-- 扫描线 -->
  <rect x="0" y="0" width="720" height="2" fill="#7aa2f7" opacity="0.15">
    <animate attributeName="y" values="0;128;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ☄️ 流星一 · 蓝白,左上 → 右下 -->
  <g filter="url(#mglow)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.10;0.115;0.16;0.175;0.18;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="60,-20;60,-20;420,200;420,200;420,200;420,200;420,200" keyTimes="0;0.10;0.175;0.18;0.19;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-55" stroke="url(#tailBlue)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-40" y2="-23" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- ☄️ 流星二 · 粉,右上 → 左下 -->
  <g filter="url(#mglow)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.55;0.565;0.61;0.625;0.63;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640,-20;640,-20;300,200;300,200;300,200;300,200;300,200" keyTimes="0;0.55;0.625;0.63;0.64;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-52" stroke="url(#tailPink)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="-21" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
    <circle r="1.8" fill="#fff5fa"/>
  </g>

  <!-- 标题行:装饰条 + BOOT SEQUENCE 整体居中,遮罩逐段点亮 -->
  <g mask="url(#reveal)">
    <text class="deco" x="360" y="46" text-anchor="middle" xml:space="preserve">░▒▓█▓▒░  BOOT SEQUENCE  ░▒▓█▓▒░</text>
  </g>

  <!-- 加载进度条 -->
  <rect x="150" y="66" width="420" height="10" rx="5" fill="#1a1b2e" stroke="#2a2d4a"/>
  <rect class="bar" x="152" y="68" height="6" rx="3" width="0">
    <animate attributeName="width" values="0;416;416" keyTimes="0;0.7;1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#7aa2f7;#bb9af7;#ff69b4" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 终端输出行 -->
  <text class="ln" x="150" y="100">&gt;&gt; LOADING SYSTEM...</text>
  <text class="ln" x="570" y="100" style="animation-delay:.3s">[OK]</text>
  <text class="ln2" x="150" y="118" style="animation-delay:.5s">&gt;&gt; 二次元领域展开完毕 🌸 READY!</text>

  <!-- ✨ 背景闪烁星点 -->
  <g fill="#c0caf5">
    <circle cx="50" cy="30" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="24" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="100" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="695" cy="105" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="66" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="70" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="112" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="16" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ✦ 十字光芒亮星 -->
  <g stroke="#a9c6ff" stroke-width="1">
    <g transform="translate(120,24)" opacity="0.8">
      <line x1="-7" y1="0" x2="7" y2="0"/><line x1="0" y1="-7" x2="0" y2="7"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(600,110)" opacity="0.8">
      <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
