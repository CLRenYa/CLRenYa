<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <defs>
    <linearGradient id="neonD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff69b4">
        <animate attributeName="stop-color" values="#ff69b4;#7aa2f7;#ff69b4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#ff69b4;#bb9af7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7aa2f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="3;7;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softD" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="tailBD" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-95" y2="-38">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#a9c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailPD" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="88" y2="-36">
      <stop offset="0" stop-color="#ffe1ee" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#ff9ecb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 透明背景:叠在星空 GIF 上 -->

  <!-- 霓虹招牌外框 -->
  <rect x="120" y="60" width="480" height="100" rx="14" fill="none" stroke="url(#neonD)" stroke-width="2.5" filter="url(#glowD)">
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- 主标题 -->
  <text x="360" y="125" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="52" font-weight="bold" fill="url(#neonD)" filter="url(#glowD)">
    CLRenYa
    <animate attributeName="opacity" values="1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- 副标题 -->
  <text x="360" y="148" text-anchor="middle" font-family="monospace" font-size="13" fill="#a9b8ff" letter-spacing="4" opacity="0.9">
    CODE · ANIME · AESTHETIC
  </text>

  <!-- 游走光点 -->
  <circle r="4" fill="#ff69b4" filter="url(#softD)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M120,60 h480 v100 h-480 z"/>
    <animate attributeName="fill" values="#ff69b4;#7aa2f7;#bb9af7;#ff69b4" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ☄️ 流星 · 蓝白 -->
  <g filter="url(#softD)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.12;0.135;0.18;0.195;0.2;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="80,-10;80,-10;430,210;430,210;430,210;430,210;430,210" keyTimes="0;0.12;0.195;0.2;0.21;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-95" y2="-38" stroke="url(#tailBD)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-40" y2="-16" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- ☄️ 流星 · 粉 -->
  <g filter="url(#softD)">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.58;0.595;0.64;0.655;0.66;1" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="640,-10;640,-10;300,215;300,215;300,215;300,215;300,215" keyTimes="0;0.58;0.655;0.66;0.67;1;1" dur="7s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="88" y2="-36" stroke="url(#tailPD)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="36" y2="-15" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
    <circle r="1.8" fill="#fff5fa"/>
  </g>
</svg>
